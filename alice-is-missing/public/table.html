<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Table · Alice is Missing</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<style>
  body { overflow-x: hidden; }
  .stage {
    min-height: 100vh; min-height: 100dvh; display: grid; gap: 24px; align-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 24px; max-width: 1200px; margin: 0 auto;
  }
  .stage.lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 360px); align-items: center; }
  @media (max-width: 760px) { .stage.lobby { grid-template-columns: minmax(0, 1fr); } }
  .main { text-align: center; }
  /* Every clamp()'d font rule below repeats as: a plain fixed font-size
     first (this TV's browser is old enough to not parse clamp() at all -
     when that happens the WHOLE `font:` shorthand is invalid and dropped,
     not just the size, which is why text was falling back to a tiny
     browser default), then a second font-size: clamp(...) declaration
     that a modern browser applies on top via normal cascade order, and
     an old one simply can't parse and ignores, leaving the fixed value. */
  .title { font-family: var(--serif); font-weight: 600; letter-spacing: .04em; color: var(--text2); font-size: 1.5rem; font-size: clamp(1.2rem, 3vw, 1.8rem); }
  .table-timer { font-family: var(--mono); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; margin: 12px 0; font-size: 9rem; font-size: clamp(5rem, 24vw, 16rem); }
  .table-timer.paused { color: var(--text3); }
  .next { color: var(--text2); font-size: 1.2rem; font-size: clamp(1rem, 2.4vw, 1.5rem); }
  .due { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  .due .pill { padding: 10px 14px; font-size: .9rem; font-size: clamp(.8rem, 1.6vw, 1rem); }
  .join { text-align: center; }
  .join .qr { max-width: 320px; margin: 0 auto 12px; }
  .roster { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; margin-top: 16px; color: var(--text2); }
  .roster span { display: inline-flex; align-items: center; gap: 6px; }
  .announce { margin: 24px auto 0; max-width: 42rem; font-family: var(--serif); font-weight: 500; line-height: 1.35; color: var(--accent); font-size: 1.3rem; font-size: clamp(1rem, 2.4vw, 1.6rem); }
  .bar { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 8px; opacity: .55; }
  .bar:hover, .bar:focus-within { opacity: 1; }
</style>
</head>
<body>
<div id="conn" hidden>Reconnecting to the game…</div>

<div id="soundGate" class="overlay">
  <p class="big">Table screen</p>
  <p class="sub" id="soundNote">Tap once so this screen is allowed to play the soundtrack.</p>
  <button class="primary" id="enable">Enable sound</button>
  <button class="small" id="silent">Continue without sound</button>
</div>

<div class="stage" id="stage">
  <section class="main">
    <div class="title">Alice is Missing</div>
    <div class="table-timer" id="timer">90:00</div>
    <div class="next" id="next"></div>
    <div class="due" id="due"></div>
    <p class="announce" id="announce" hidden></p>
    <p id="transcript" hidden style="margin-top:24px"><a class="btn primary" href="/transcript">Read the transcript</a></p>
  </section>
  <section class="join" id="join">
    <div id="qr"></div>
    <div class="mono" id="joinUrl"></div>
    <p class="hint">Scan to join, or tap your seat's NFC tag.</p>
    <div class="roster" id="roster"></div>
  </section>
</div>

<div class="bar">
  <span class="pill" id="audioState">No sound</span>
  <button class="small" id="toggle">Pause</button>
</div>

<audio id="audio" preload="auto"></audio>
<!-- Audio-only: 1x1 and off-screen rather than display:none, which some
     browsers use as a cue to fully suspend an iframe's playback. -->
<div id="ytHost" style="position:fixed; width:1px; height:1px; overflow:hidden; left:-9999px;"></div>

<!-- Plain ES5 only, on purpose: some Smart TV browsers (confirmed: Samsung's
     Tizen "Internet" app, an old WebKit build regardless of TV model year)
     fail to parse the modern syntax used below/in client.js and abort the
     WHOLE script, which silently kills every handler in it - including the
     sound-gate buttons. This tiny script is self-contained so the buttons
     keep working no matter what the rest of the app's JS does on a given
     device. It uses addEventListener (not .onclick) so it layers on top of
     the richer handlers further down without conflicting with them. -->
<script>
(function () {
  function dismiss(full) {
    var gate = document.getElementById("soundGate");
    if (gate) {
      gate.setAttribute("hidden", "hidden");
      gate.style.display = "none";
    }
    if (full) {
      var audio = document.getElementById("audio");
      if (audio && audio.play) {
        try {
          var p = audio.play();
          if (p && p.catch) p.catch(function () {});
          audio.pause();
        } catch (e) {}
      }
      if (document.documentElement.requestFullscreen) {
        try { document.documentElement.requestFullscreen(); } catch (e) {}
      }
    }
  }
  function wire(id, full) {
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener("click", function () { dismiss(full); });
    btn.addEventListener("keydown", function (e) {
      var key = e.key, code = e.keyCode;
      if (key === "Enter" || key === " " || code === 13 || code === 32) {
        if (e.preventDefault) e.preventDefault();
        dismiss(full);
      }
    });
  }
  wire("enable", true);
  wire("silent", false);
  var enableBtn = document.getElementById("enable");
  if (enableBtn && enableBtn.focus) enableBtn.focus();
})();
</script>

<!-- ?v= busts any cache that ignores the no-store header outright (confirmed
     necessary: this app's target Smart TV browser). Bump whenever client.js
     or this file's own inline script changes. -->
<script src="/vendor/qrcode.js?v=2026-09-28-f"></script>
<script src="/client.js?v=2026-09-28-f"></script>
<script>
const { esc, fmt } = Alice;
const audio = document.getElementById("audio");
let soundOn = false;
let lastQr = "";

// ---- YouTube fallback: only used when the Pi has no local soundtrack file.
// Streamed live from YouTube's own player, nothing downloaded or stored.
let yt = null; // YT.Player once the API and a video id are both ready
let ytReady = false;
let ytVideoId = null;

function loadYouTubeApiOnce() {
  if (window.YT || document.getElementById("yt-api")) return;
  const tag = document.createElement("script");
  tag.id = "yt-api";
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = () => { ytReady = true; maybeCreateYtPlayer(); };

function maybeCreateYtPlayer() {
  if (!ytReady || !ytVideoId || yt) return;
  yt = new YT.Player("ytHost", {
    videoId: ytVideoId,
    playerVars: { controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => soundOn && reportAudio(true),
      onError: () => reportAudio(false),
    },
  });
}

function render(s) {
  const lobby = s.phase === "setup";
  document.getElementById("stage").classList.toggle("lobby", lobby);
  document.getElementById("join").hidden = !lobby;
  if (lobby) {
    const url = Alice.joinUrl();
    if (url !== lastQr) {
      document.getElementById("qr").innerHTML = Alice.qrSvg(url);
      document.getElementById("joinUrl").textContent = url;
      lastQr = url;
    }
    document.getElementById("roster").innerHTML = s.seats
      .map((x) => `<span><i class="dot ${x.online ? "on" : ""}"></i>${esc(x.character || x.name || `Seat ${x.id}`)}</span>`)
      .join("");
  }

  document.getElementById("due").innerHTML = Alice.dueIntervals()
    .map((m) => `<span class="pill alert">${m}:00 clue · ${esc(Alice.holderLabel(m))}</span>`)
    .join("");

  document.getElementById("transcript").hidden = s.phase !== "ended";
  const announce = document.getElementById("announce");
  announce.hidden = !s.announcement;
  announce.textContent = s.announcement;

  const toggle = document.getElementById("toggle");
  toggle.hidden = s.phase === "setup" || s.phase === "ended";
  toggle.textContent = s.phase === "paused" ? "Resume" : "Pause";

  if (s.soundtrack && audio.dataset.src !== s.soundtrack) {
    audio.dataset.src = s.soundtrack;
    audio.src = s.soundtrack;
  }
  if (s.youtubeId && s.youtubeId !== ytVideoId) {
    ytVideoId = s.youtubeId;
    loadYouTubeApiOnce();
    maybeCreateYtPlayer();
  }
  document.getElementById("soundNote").textContent = s.soundtrack
    ? "Tap once so this screen is allowed to play the soundtrack."
    : s.youtubeId
    ? "Tap once so this screen is allowed to play the soundtrack (streamed from YouTube)."
    : "No soundtrack on the Pi yet — add an audio file to the media folder. The timer works without it.";
  syncAudio();
}

// Keep the soundtrack where the clock says it should be. Same logic for the
// local <audio> element and the YouTube fallback player - only one of the
// two is ever active, decided server-side (a local file always wins).
function syncAudio() {
  const s = Alice.state;
  const label = document.getElementById("audioState");
  const usingYt = Boolean(s && s.youtubeId);
  if (!s || !soundOn || (!s.soundtrack && !usingYt)) {
    label.textContent = "No sound";
    return;
  }
  if (usingYt) return syncYoutube(s, label);
  if (s.clock.speed !== 1) {
    audio.pause();
    label.textContent = `Muted at x${s.clock.speed}`;
    return;
  }
  if (s.phase !== "running") {
    audio.pause();
    label.textContent = audio.readyState >= 3 ? "Sound ready" : "Loading sound";
    return;
  }
  const target = Alice.elapsedMs() / 1000 + s.config.audioOffsetSeconds;
  if (Math.abs(audio.currentTime - target) > 1.5) audio.currentTime = target;
  if (audio.paused) audio.play().catch(() => {});
  label.textContent = "Playing";
}

// Re-checking drift every second and re-seeking on >1.5s of it (as the local
// <audio> path does) made the embedded YouTube player choppy on this app's
// target Smart TVs: each getCurrentTime()/seekTo() call is a postMessage
// round-trip into the iframe, and firing that constantly caused audible
// stutter. A background soundtrack doesn't need second-level precision, so
// this only checks/corrects drift every 5s, and only past a looser 4s.
let lastYtSyncAt = 0;
function syncYoutube(s, label) {
  if (!yt || typeof yt.getPlayerState !== "function") {
    label.textContent = "Loading sound";
    return;
  }
  const YTSTATE = { PLAYING: 1, PAUSED: 2, CUED: 5 };
  if (s.clock.speed !== 1) {
    yt.pauseVideo();
    label.textContent = `Muted at x${s.clock.speed}`;
    return;
  }
  if (s.phase !== "running") {
    yt.pauseVideo();
    label.textContent = "Sound ready";
    return;
  }
  if (yt.getPlayerState() !== YTSTATE.PLAYING) yt.playVideo();
  const now = performance.now();
  if (now - lastYtSyncAt > 5000) {
    lastYtSyncAt = now;
    const target = Alice.elapsedMs() / 1000 + s.config.audioOffsetSeconds;
    if (Math.abs(yt.getCurrentTime() - target) > 4) yt.seekTo(target, true);
  }
  label.textContent = "Playing";
}

function tick() {
  const s = Alice.state;
  if (s) {
    const t = document.getElementById("timer");
    t.textContent = fmt(Alice.remainingMs());
    t.classList.toggle("paused", s.phase !== "running");
    const next = Alice.nextInterval();
    document.getElementById("next").textContent =
      s.phase === "setup" ? "Waiting to start"
        : s.phase === "ended" ? "Time's up"
        : s.phase === "paused" ? "Paused"
        : next != null ? `Next clue at ${next}:00 · ${Alice.holderLabel(next)}` : "No more clues";
  }
  requestAnimationFrame(tick);
}

const reportAudio = (ready) => Alice.act("tableAudio", { ready }).catch(() => {});
audio.addEventListener("canplaythrough", () => soundOn && reportAudio(true));
audio.addEventListener("error", () => soundOn && reportAudio(false));
addEventListener("pagehide", () => {
  navigator.sendBeacon("/api/action", new Blob([JSON.stringify({ type: "tableAudio", ready: false })], { type: "application/json" }));
});

document.getElementById("enable").onclick = async () => {
  soundOn = true;
  document.getElementById("soundGate").hidden = true;
  Alice.wakeLock();
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  // Play-then-pause inside the tap unlocks audio for later, unprompted playback.
  if (audio.src) {
    try {
      await audio.play();
      audio.pause();
    } catch (e) {
      /* unlocking failed; syncAudio will retry */
    }
    if (audio.readyState >= 3) reportAudio(true);
  }
  if (ytVideoId) {
    loadYouTubeApiOnce();
    maybeCreateYtPlayer();
    // Same play-then-pause trick, once the player exists.
    for (let i = 0; i < 20 && !yt; i++) await new Promise((r) => setTimeout(r, 100));
    try {
      if (yt) yt.playVideo();
      setTimeout(() => { if (yt) yt.pauseVideo(); }, 150);
    } catch (e) {
      /* unlocking failed; syncAudio will retry */
    }
  }
  syncAudio();
};
document.getElementById("silent").onclick = () => {
  document.getElementById("soundGate").hidden = true;
  Alice.wakeLock();
};
document.getElementById("toggle").onclick = () => {
  const s = Alice.state;
  Alice.host(s.phase === "paused" ? "resume" : "pause").catch((err) => Alice.toast(err.message));
};

// Some TV remotes move a visual "cursor" over focusable elements without
// giving them real DOM focus, so their OK button never triggers the
// browser's normal Enter-activates-the-focused-button behavior. Give the
// gate's primary button real focus up front, and back up Enter/Space on
// both buttons with an explicit click() - harmless no-op on browsers where
// the native activation already fires (the handlers above are idempotent).
document.getElementById("enable").focus();
for (const id of ["enable", "silent"]) {
  document.getElementById(id).addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.keyCode === 13) {
      e.preventDefault();
      e.currentTarget.click();
    }
  });
}

setInterval(syncAudio, 1000);
Alice.connect("table", render);
tick();
</script>
</body>
</html>
